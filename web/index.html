<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>drone-verifier</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Reads at 6 feet on a projector: 1rem scales with the window, nothing under 0.8rem. */
:root { --bg:#07090c; --panel:#10141a; --line:#242b35; --fg:#f2f4f7; --dim:#98a2b0; --red:#ff5a50; --green:#5fe38a; --amber:#ffc850; --cyan:#5cd6ff; }
html { font-size: clamp(14px, 1.28vw, 34px); }
* { box-sizing: border-box; }
body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--fg); font:1rem/1.3 system-ui, "Segoe UI", Helvetica, Arial, sans-serif; }
#app { height:100%; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
.dim { color:var(--dim); }
.red { color:var(--red); }
.green { color:var(--green); }

.single { display:grid; grid-template-columns: minmax(0,1fr) 24rem; height:100%; gap:.6rem; padding:.6rem; }
.versus { display:grid; grid-template-columns: 1fr 1fr; height:100%; gap:.6rem; padding:.6rem; }
.col { display:flex; flex-direction:column; gap:.5rem; min-height:0; min-width:0; }
.head { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; }
.model { font-size:1.6rem; font-weight:700; letter-spacing:.01em; }
.score { font-size:1.6rem; font-weight:700; font-variant-numeric:tabular-nums; }

.video { position:relative; background:#000; border:1px solid var(--line); flex:0 1 auto; aspect-ratio:16/9; width:100%; max-height:calc(100vh - 13.5rem); display:flex; align-items:center; justify-content:center; overflow:hidden; }
.versus .video { max-height:none; flex:0 0 auto; }
.video video { width:100%; height:100%; object-fit:contain; display:block; }
.under { flex:1 1 auto; min-height:0; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:.8rem; align-items:stretch; }
.under .plot { height:100%; min-height:5rem; }
.under .meters { align-content:space-around; }
.video .badge { position:absolute; top:.5rem; left:.5rem; padding:.1rem .6rem; background:#000c; font-weight:700; font-size:.85rem; letter-spacing:.08em; }
.badge.live { color:var(--red); }
.badge.replay { color:var(--amber); }
.video .nolink { position:absolute; color:var(--dim); font-size:1.4rem; }

.ladder { display:flex; flex-direction:column; gap:.2rem; min-width:0; }
.rung { display:grid; grid-template-columns:1.8rem 5.2rem 1fr; column-gap:.3rem; background:var(--panel); border:2px solid var(--line); padding:.1rem .4rem; color:var(--dim); align-items:baseline; font-size:1rem; }
.rung b { font-size:1.1rem; }
.rung .st { font-weight:800; text-align:right; }
.rung .tx { grid-column:1 / -1; font-size:.85rem; line-height:1.15; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:1; }
.rung .tx:empty { display:none; }
.rung.pass { background:#0f3a20; border-color:var(--green); color:var(--fg); }
.rung.fail { background:#4a1512; border-color:var(--red); color:var(--fg); }
.rung.fail .tx { -webkit-line-clamp:2; font-size:.95rem; }
.rung.run { border-color:var(--amber); color:var(--fg); }
.rung.run .st { color:var(--amber); }
.rung.skip { opacity:.55; }
.fb { display:flex; flex-wrap:wrap; justify-content:space-between; gap:0 .8rem; font-size:.82rem; color:var(--dim); }
.fb b { color:var(--fg); }
.vsinfo { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:.6rem; flex:0 0 auto; }
.vsside { display:flex; flex-direction:column; gap:.3rem; min-width:0; }
.vsside .plot { height:4rem; }
.versus .verdict { font-size:2rem; min-height:0; padding:0; }
.versus .verdict small { font-size:.85rem; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }

.meters { display:grid; grid-template-columns:1fr 1fr; gap:.3rem .8rem; }
.meter .row { display:flex; justify-content:space-between; font-variant-numeric:tabular-nums; font-size:.95rem; }
.meter .val { font-weight:700; font-size:1.1rem; }
.bar { height:.4rem; background:var(--line); }
.bar i { display:block; height:100%; background:var(--green); }
.meter.bad .val { color:var(--red); }
.meter.bad .bar i { background:var(--red); }
.facts { display:flex; justify-content:space-between; gap:.8rem; font-size:.95rem; font-variant-numeric:tabular-nums; }
.facts b { font-size:1.1rem; }

.plot { width:100%; height:6.5rem; display:block; background:var(--panel); border:1px solid var(--line); flex:0 0 auto; }
.log { flex:1 1 0; min-height:0; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; background:var(--panel); border:1px solid var(--line); padding:.35rem .55rem; font-size:.92rem; }
.log div { margin:.12rem 0; overflow-wrap:anywhere; }
.k-agent { color:#d5dae2; }
.k-call { color:var(--cyan); }
.k-ok { color:var(--dim); }
.k-err { color:var(--red); font-weight:600; }
.k-good { color:var(--green); }
.k-code { color:var(--amber); }
.k-flight { color:#fff; }
.k-verify { color:#fff; font-weight:800; }
.k-verify.bad { color:var(--red); }
.k-verify.good { color:var(--green); }

.verdict { text-align:center; font-weight:800; font-size:3.2rem; line-height:1.05; padding:.3rem 0; min-height:4rem; }
.verdict small { display:block; font-size:1.05rem; font-weight:500; color:var(--dim); line-height:1.25; }
.verdict.pass { color:var(--green); }
.verdict.fail { color:var(--red); }

.board { padding:.8rem 1.4rem; height:100%; display:flex; flex-direction:column; gap:.5rem; }
.board h1 { margin:0; font-size:1.8rem; }
.board table { width:100%; border-collapse:collapse; font-size:1.05rem; font-variant-numeric:tabular-nums; }
.board th { text-align:left; color:var(--dim); font-weight:500; font-size:.85rem; line-height:1.1; padding:.15rem .4rem; border-bottom:2px solid var(--line); vertical-align:bottom; }
.board td { padding:.15rem .4rem; border-bottom:1px solid var(--line); }
.board td.score { font-size:1.5rem; }
.board tr.base td { color:var(--dim); font-style:italic; }
.panels { flex:1 1 0; min-height:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.8rem; }
.panel { background:var(--panel); border:1px solid var(--line); padding:.4rem .7rem; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
.panel h2 { margin:0 0 .2rem; font-size:1.05rem; }
.panel svg { flex:1 1 0; min-height:0; width:100%; }
.panel svg text { font:21px system-ui, sans-serif; }
.panel svg text:not([fill]) { fill:var(--dim); }
.panel svg .grid { stroke:var(--line); stroke-width:1; }
.small { font-size:.82rem; line-height:1.15; }
.norun { flex:1; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:1.4rem; min-height:3rem; }
.trustnum { display:flex; justify-content:space-between; gap:1rem; font-size:1rem; margin-bottom:.3rem; }
.trustnum b { font-size:1.7rem; }
.trustrows { flex:1 1 0; min-height:0; overflow:hidden; font-size:.85rem; line-height:1.2; column-count:1; }
.trustrows div { display:flex; justify-content:space-between; gap:.5rem; border-bottom:1px solid var(--line); }
.trustrows div.red { color:var(--red); font-weight:700; }
.board tr.top td.name { color:var(--green); }
.board tr.low td.name { color:var(--red); }
.board .tag { font-size:.8rem; font-weight:700; margin-left:.6rem; padding:.05rem .4rem; border:1px solid currentColor; }
.board .chips { display:flex; gap:.2rem; }
.board .chip { width:2.2rem; text-align:center; font-size:.85rem; padding:.2rem 0; background:var(--panel); border:1px solid var(--line); color:var(--dim); }
.board .chip.pass { background:#0f3a20; border-color:var(--green); color:var(--fg); }
.board .chip.fail { background:#4a1512; border-color:var(--red); color:var(--fg); }
.board .why { font-size:.95rem; color:var(--dim); max-width:24rem; }
.board a { color:var(--cyan); }
.board .actions { display:flex; gap:1.5rem; font-size:1.1rem; }
.err { padding:2rem; font-size:1.3rem; color:var(--red); }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
