chip = "ublox-neo-m8n"
price = 55.0
price_src = "looked up, dvsim parts/_prices/power.toml"
harness_mass = 0.036
spec = { horizontal_sigma_m = 1.0 }
horiz_std = 1.0
vert_std = 1.5
corr_time_s = 600.0
corr_frac = 0.9
[[slots.gnss.options]]
part = "matek-m10q-5883"
chip = "ublox-neo-m8n"
price = 44.84
price_src = "looked up, dvsim parts/_prices/power.toml"
harness_mass = 0.030
spec = { horizontal_sigma_m = 1.5 }
horiz_std = 1.5
vert_std = 2.25
corr_time_s = 600.0
corr_frac = 0.9
[[slots.gnss.options]]
part = "holybro-m8n-gps"
chip = "ublox-neo-m8n"
price = 35.0
