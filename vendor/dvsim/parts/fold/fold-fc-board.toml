id = "fold-fc-board"
name = "fold drone flight controller (own design): RP2350A + ICM-42688-P + servo-rail switch, 30.5 x 30.5 mm"
category = "pcb.fc"
vendor = "dvsim fold (own design)"
part_number = "fold-fc v1"
url = "firmware/fold-fc/include/pins.h"

# The board is ours, so its pinout is the firmware's (pins.h is the single source; docs/fold/wiring.md has the table). Frame: origin at the board centre on the underside, +z up.
# On-board nets, not wired in the model: GP12 LED / buzzer, GP14 servo-rail P-MOSFET gate (pull-down = off), GP16-GP20 SPI0 + INT1 to the ICM-42688-P, the pull-up (4.7 k to 3V3 [est])
# and the 100 ohm series resistor [est] of each servo bus (the RP2350 PIO drives the half-duplex line itself: no direction buffer, FW round 2), and the divider on GP26 (VBAT) [est].

[params]
mass = { value = 0.005, unit = "kg", fidelity = "estimated", rationale = "Spec 3.1 FC line: a 30.5 mm 4-layer board with the MCU, flash, IMU, MOSFET and connectors; weigh the assembled board (bench B-MASS)." }
price = { value = 20.0, unit = "USD", fidelity = "estimated", rationale = "Spec 3.5: PCB + RP2350A + ICM-42688-P, assembled, per board of 5; no quote fetched." }
supply_voltage_min = { value = 4.5, unit = "V", fidelity = "estimated", rationale = "On-board 3.3 V LDO input range, estimated." }
supply_voltage_max = { value = 5.5, unit = "V", fidelity = "estimated", rationale = "As above." }

[geometry]
shape = "box"
size = [0.01525, 0.01525, 0.002]
pos = [0.0, 0.0, 0.002]

[[ports]]
name = "base"
kind = "mech"
type = "flat-mount"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1

[[ports]]
name = "power_in"
kind = "power"
type = "jst-sh.4"
gender = "neutral"
role = "sink"
pins = ["V5.5V", "V5.G"]
v_max = { value = 5.5, unit = "V", fidelity = "estimated", rationale = "As supply_voltage_max." }

[[ports]]
name = "v5_out"
kind = "power"
type = "jst-sh.4"
gender = "neutral"
role = "source"
pins = ["FLOW.5V", "FLOW.G"]
v_nominal = { value = 5.0, unit = "V", fidelity = "estimated", rationale = "Straight from the 5 V input (no on-board regulator in front of the flow sensor); the model keeps the 5 V in and out as separate nets." }
note = "5 V to the flow sensor (from the 5 V input)."

[[ports]]
name = "rc_pwr"
kind = "power"
type = "jst-sh.4"
gender = "neutral"
role = "source"
pins = ["RC.5V", "RC.G"]
v_nominal = { value = 5.0, unit = "V", fidelity = "estimated", rationale = "As v5_out." }
note = "5 V to the receiver (from the 5 V input)."

[[ports]]
name = "rail_in"
kind = "power"
type = "jst-sh.4"
gender = "neutral"
role = "sink"
pins = ["RIN.6V", "RIN.G"]
v_max = { value = 7.4, unit = "V", fidelity = "estimated", rationale = "P-MOSFET switch and servo ratings (STS 6 V, SCS 7.4 V max)." }

[[ports]]
name = "rail_out"
kind = "power"
type = "jst-sh.4"
gender = "neutral"
role = "source"
pins = ["SRV.6V", "SRV.G"]
v_nominal = { value = 6.0, unit = "V", fidelity = "estimated", rationale = "The switched 6 V rail (P-MOSFET on GP14) of the servo BEC." }
i_max = { value = 5.0, unit = "A", fidelity = "estimated", rationale = "The BEC's 5 A; the switch is sized for it (S6, spec 3.3)." }

[[ports]]
name = "pi_uart"
kind = "signal"
type = "uart"
gender = "neutral"
pins = ["PI.TX", "PI.RX", "PI.G"]
note = "GP0 TX, GP1 RX, 2 Mbaud, 3.3 V."

[[ports]]
name = "flow_uart"
kind = "signal"
type = "uart"
gender = "neutral"
pins = ["FLOW.TX", "FLOW.RX", "FLOW.G"]
note = "GP2 TX, GP3 RX (PIO UART, MSP to the 3901-L0X)."

[[ports]]
name = "rc_uart"
kind = "signal"
type = "uart"
gender = "neutral"
pins = ["RC.TX", "RC.RX", "RC.G"]
note = "GP4 TX, GP5 RX, CRSF 420 kbaud."

[[ports]]
name = "servo_bus"
kind = "signal"
type = "feetech-ttl"
gender = "neutral"
pins = ["SRV.A", "SRV.B"]
note = "GP6 bus A (corners, STS), GP7 bus B (pods, SCS), half-duplex, pull-up + series resistor on the board."

[[ports]]
name = "esc_sig"
kind = "signal"
type = "dshot"
gender = "neutral"
pins = ["ESC.M1", "ESC.M2", "ESC.M3", "ESC.M4", "ESC.G"]
note = "GP8-GP11 DShot600 bidirectional to the 4-in-1 ESC."

[[ports]]
name = "esc_sense"
kind = "signal"
type = "analog"
gender = "neutral"
pins = ["ESC.VBAT", "ESC.CUR", "ESC.G"]
note = "GP26 pack voltage (on-board divider), GP27 ESC current sensor output."

