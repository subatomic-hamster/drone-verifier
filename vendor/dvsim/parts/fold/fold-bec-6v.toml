url = "docs/fold/bom.md"

# Spec 3.1 / 3.3: a class, not a bought part. 6.0 V is inside both servo ranges (STS 4.8-6, SCS 4-7.4); the FC switches this rail (GP14). Frame as fold-bec-5v.

[params]
mass = { value = 0.007, unit = "kg", fidelity = "estimated", rationale = "Spec 3.1 BEC line." }
price = { value = 7.0, unit = "USD", fidelity = "estimated", rationale = "Spec 3.5: two BECs $14." }
efficiency = { value = 0.9, unit = "1", fidelity = "estimated", rationale = "Class value for a 3S to 6 V buck at 1-2 A." }
i_out_rated = { value = 5.0, unit = "A", fidelity = "estimated", rationale = "'5 A' class (spec 3.3)." }
v_out_nominal = { value = 6.0, unit = "V", fidelity = "estimated", rationale = "6 V module class; inside the STS (4.8-6) and SCS (4-7.4) ranges." }
r_out = { value = 0.02, unit = "ohm", fidelity = "estimated", rationale = "Output impedance of a small buck module under load; no data, tune on the bench." }
current_limit = { value = 5.5, unit = "A", fidelity = "estimated", rationale = "110 % of the 5 A class." }

