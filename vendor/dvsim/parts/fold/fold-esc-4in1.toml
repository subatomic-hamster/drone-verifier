id = "fold-esc-4in1"
name = "4-in-1 ESC, 20 A class per channel, 2-4S, bidirectional DShot (generic AM32 / Bluejay board, 28 x 28 mm)"
category = "esc"
vendor = "generic (part not chosen: spec 10 Q8)"
part_number = "4in1-20A (to be chosen)"
url = "docs/fold/bom.md"

# Spec 3.3 / 3.1: "4-in-1, 20 A class per channel, 2-4S, bidirectional DShot, current sensor output to the FC ADC" is a class, not a bought part: every number here is
# [est] until a board is picked (bom.md lists candidates to look up). Frame: origin at the board centre on the underside, +z up.

[params]
mass = { value = 0.006, unit = "kg", fidelity = "estimated", rationale = "Spec 3.1 ESC line: a bare 20 x 20 to 28 x 28 mm 4-in-1 board is 5-8 g; weigh the chosen board." }
price = { value = 28.0, unit = "USD", fidelity = "estimated", rationale = "Spec 3.5 estimate; no listing fetched." }
current_continuous = { value = 20.0, unit = "A", fidelity = "estimated", rationale = "'20 A class per channel' (spec 3.3)." }
current_peak = { value = 25.0, unit = "A", fidelity = "estimated", rationale = "Class value for 10 s bursts; not a datasheet." }
v_cells_min = { value = 2, unit = "cells", fidelity = "estimated", rationale = "Spec 3.3: 2-4S." }
v_cells_max = { value = 4, unit = "cells", fidelity = "estimated", rationale = "Spec 3.3: 2-4S." }
r_on_total = { value = 0.012, unit = "ohm", fidelity = "estimated", rationale = "Same assumption as the x500v2 ESC part: 2 conducting FETs of ~6 mOhm each; unpublished for a class." }
switching_loss_fraction = { value = 0.0015, unit = "1", fidelity = "estimated", rationale = "As the x500v2 ESC part (a fraction of motor-side power)." }
quiescent_current = { value = 0.02, unit = "A", fidelity = "estimated", rationale = "MCU, four gate drivers and the on-board regulator from the pack; 20 mA assumed." }

[geometry]
shape = "box"
size = [0.014, 0.014, 0.0025]
pos = [0.0, 0.0, 0.0025]

[[ports]]
name = "base"
kind = "mech"
type = "flat-mount"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1

[[ports]]
name = "power_in"
kind = "power"
type = "solder-pad"
gender = "neutral"
role = "sink"
pins = ["PWR.VBAT", "PWR.G"]
v_max = { value = 16.8, unit = "V", fidelity = "estimated", rationale = "4S x 4.2 V (spec 3.3: 2-4S)." }
i_max = { value = 60.0, unit = "A", fidelity = "estimated", rationale = "Board pads rated for 4 channels at 15 A average; class value." }

[[ports]]
name = "m1"
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
pins = ["M1.A", "M1.B", "M1.C"]
i_max = { value = 20.0, unit = "A", fidelity = "estimated", rationale = "As current_continuous." }

[[ports]]
name = "m2"
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
pins = ["M2.A", "M2.B", "M2.C"]
i_max = { value = 20.0, unit = "A", fidelity = "estimated", rationale = "As current_continuous." }

[[ports]]
