[[connectors]]
id = "PWR"
name = "battery pads VBAT, GND (BEC inputs share them)"
type = "solder-pad"
port_type = "solder-pad"
gender = "neutral"
joinable = true
pos = [-0.014, 0.0, 0.0]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 2
pitch = 0.004
fidelity = "estimated"
rationale = "Pad pitch and side are layout choices of the (unchosen) board."
pins = [
  { number = "VBAT", name = "VBAT", kind = "power", dir = "in", v = 12.6, v_max = 16.8 },
  { number = "G", name = "GND", kind = "ground" },
]

